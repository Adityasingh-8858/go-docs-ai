version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellidocs-ai-app
    ports:
      - "3000:3000"
    # The .env.local file will be used for environment variables during local development.
    # Make sure to create a .env.local file from the .env.example.
    env_file:
      - .env.local
    volumes:
      # Mount the source code for hot-reloading during development
      # This overrides the files in the Docker image for the dev environment
      - .:/app
      # Exclude node_modules from being overwritten by the host's empty folder
      - /app/node_modules
      - /app/.next
    # Command to run the development server
    command: npm run dev
networks:
  default:
    name: intellidocs-network
